# Vercel hosts the web app. Render hosts its persistent reconciliation worker
# and PostgreSQL. The worker uses Render's least expensive paid compute plan.
services:
  - type: worker
    name: ledgermatch-worker
    runtime: node
    region: virginia
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev
    preDeployCommand: npx tsx scripts/migrate.ts
    startCommand: npx tsx src/worker.ts
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ledgermatch-db
          property: connectionString
      - key: ML_ENABLED
        value: "true"
      - key: ML_MODEL_FILE
        value: ranker.json

databases:
  - name: ledgermatch-db
    databaseName: ledgermatch
    user: ledger
    region: virginia
    plan: free
    postgresMajorVersion: "17"
    # Vercel connects over TLS using the external database URL.
    ipAllowList:
      - source: 0.0.0.0/0
        description: External TLS access for Vercel functions
